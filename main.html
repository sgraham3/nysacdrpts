    var results = document.getElementById('results');
    var searchInput = document.getElementById('searchInput');
    var stats = document.getElementById('stats');

    var q = '';
    function doSearch() {
        q = searchInput.value.toLowerCase().trim();
        results.innerHTML = '';
        stats.textContent = '';
        if (!q) return;
        var opts = {
            subject: document.getElementById('searchSubject').checked,
            sender: document.getElementById('searchSender').checked,
            body: document.getElementById('searchBody').checked,
            attachments: document.getElementById('searchAttachments').checked
        };
        var count = 0;
        for (var i = 0; i < emails.length; i++) {
            var e = emails[i];
            var match = false;
            if (opts.subject && e[0].toLowerCase().includes(q)) match = true;
            if (opts.sender && e[1].toLowerCase().includes(q)) match = true;
            if (opts.attachments && e[4].includes(q)) match = true;
            if (match) {
                var div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = '<a href="emails/' + e[5] + '">' + e[0] + '</a>' +
                    '<div class="result-meta">' + e[2] + ' &mdash; ' + e[1] + ' &mdash; ' + e[3] + '</div>';
                results.appendChild(div);
                count++;
            }
        }
        stats.textContent = count + ' results';
    }

    searchInput.addEventListener('input', doSearch);
    document.querySelectorAll('.search-controls input').forEach(function(cb) {
        cb.addEventListener('change', doSearch);
    });
