<!DOCTYPE html>
<html class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <style>
      .staticrypt-hr {
        margin-top: 20px;
        margin-bottom: 20px;
        border: 0;
        border-top: 1px solid #eee;
      }
      .staticrypt-page {
        width: 360px;
        padding: 8% 0 0;
        margin: auto;
        box-sizing: border-box;
      }
      .staticrypt-form {
        position: relative;
        z-index: 1;
        background: #ffffff;
        max-width: 360px;
        margin: 0 auto 100px;
        padding: 45px;
        text-align: center;
        box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
      }
      .staticrypt-form input[type="password"] {
        outline: 0;
        background: #f2f2f2;
        width: 100%;
        border: 0;
        margin: 0 0 15px;
        padding: 15px;
        box-sizing: border-box;
        font-size: 14px;
      }
      .staticrypt-form .staticrypt-decrypt-button {
        text-transform: uppercase;
        outline: 0;
        background: #3498db;
        width: 100%;
        border: 0;
        padding: 15px;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
      }
      .staticrypt-form .staticrypt-decrypt-button:hover,
      .staticrypt-form .staticrypt-decrypt-button:active,
      .staticrypt-form .staticrypt-decrypt-button:focus {
        background: #2980b9;
      }
      .staticrypt-html { height: 100%; }
      .staticrypt-body { height: 100%; margin: 0; }
      .staticrypt-content {
        height: 100%;
        margin-bottom: 1em;
        background: #f9f9f9;
        font-family: "Arial", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .staticrypt-instructions {
        margin-top: -1em;
        margin-bottom: 1em;
      }
      .staticrypt-footer {
        position: fixed;
        height: 20px;
        font-size: 16px;
        padding: 2px;
        bottom: 0;
        left: 0;
        right: 0;
        margin-bottom: 0;
      }
      .staticrypt-footer p { margin: 2px; text-align: center; float: right; }
      .staticrypt-footer a { text-decoration: none; }
      .staticrypt-title { font-size: 1.5em; }
      .hidden { display: none !important; }
      .staticrypt-spinner-container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .staticrypt-spinner {
        display: inline-block;
        width: 2rem;
        height: 2rem;
        vertical-align: text-bottom;
        border: 0.25em solid gray;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spinner-border 0.75s linear infinite;
      }
      @keyframes spinner-border { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container">
      <div class="staticrypt-spinner"></div>
    </div>
    <div id="staticrypt_content" class="staticrypt-content hidden">
      <div class="staticrypt-page">
        <div class="staticrypt-form">
          <div class="staticrypt-instructions">
            <p class="staticrypt-title">/*[|template_title|]*/0</p>
            <p>/*[|template_instructions|]*/0</p>
          </div>
          <hr class="staticrypt-hr" />
          <form id="staticrypt-form" action="#" method="post">
            <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autofocus />
            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
          </form>
        </div>
      </div>
    </div>
    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;
      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };
      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();
        }
      };
      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const passphrase = document.getElementById("staticrypt-password").value;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(passphrase, false);
        if (!isSuccessful) { alert(templateError); }
      });
    </script>
  </body>
</html>
